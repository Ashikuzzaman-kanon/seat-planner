<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- The brand square, as in the app's sidebar and sign-in pages. -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#shine)"/>

  <!-- A ticket: notched sides and a tear-off line, tilted a little. Kept to
       bold shapes only, so it still reads at 16px in a browser tab. -->
  <g transform="rotate(-14 32 32)">
    <path fill="#ffffff" d="M14 18H50a5 5 0 0 1 5 5V26.5a5.5 5.5 0 0 0 0 11V41a5 5 0 0 1-5 5H14a5 5 0 0 1-5-5V37.5a5.5 5.5 0 0 0 0-11V23a5 5 0 0 1 5-5Z"/>
    <line x1="41" y1="22.5" x2="41" y2="41.5" stroke="#5b4ee8" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="3.2 4.4"/>
  </g>
</svg>
