# The Android app (android/): unit tests, lint and an APK for every change to
# it, and a GitHub Release with the signed APK for a tag like android-v1.0.1.
name: Android

on:
  push:
    branches: [master]
    tags: ["android-v*"]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write # the release, on a tag

    defaults:
      run:
        working-directory: android

    env:
      # Secrets are absent on pull requests from forks; the build is then a
      # debug APK, which needs no key.
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/android-v') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches versionName
        if: env.IS_RELEASE == 'true'
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "android-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi
          if [ "$HAS_SIGNING_KEY" != "true" ]; then
            echo "::error::A release needs the signing key secrets (see android/README.md)"
            exit 1
          fi

      - name: Signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tests, lint and APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug ${{ env.HAS_SIGNING_KEY == 'true' && 'assembleRelease' || 'assembleDebug' }}

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: seat-planner-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Keep the lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Publish the release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#android-}"
          cp app/build/outputs/apk/release/app-release.apk "seat-planner-$version.apk"
          gh release create "$GITHUB_REF_NAME" "seat-planner-$version.apk" \
            --title "Android app $version" \
            --notes "Open this page on the phone, download **seat-planner-$version.apk** and open it. Android asks once to allow installs from the browser. Installs over an earlier version without signing anyone out — see android/README.md."
